name: Monitor Terminal X prices

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Check only one explicit Terminal X product"
        required: true
        type: boolean
        default: true
      test_product_url:
        description: "Exact Terminal X product URL, including ?color="
        required: false
        type: string
        default: ""
      max_requests:
        description: "Maximum Terminal X page requests"
        required: true
        type: choice
        options:
          - "1"
          - "3"
          - "5"
        default: "1"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out monitor code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check supported products and save observations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_MODE: ${{ inputs.test_mode }}
          TEST_PRODUCT_URL: ${{ inputs.test_product_url }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
        run: python3 scripts/price_monitor.py
